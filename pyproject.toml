[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness"
version = "0.2.0"
description = "Self-hosted multi-agent AI orchestration framework with PostgreSQL-backed context"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kiarad Zafar Heidari" }]
keywords = ["ai", "agent", "llm", "postgresql", "langgraph", "rag"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "msgpack>=1.0.0",
    "cachetools>=5.3.0",
    "pyyaml>=6.0",
    "tiktoken>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
secrets = ["boto3>=1.34.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff==0.16.9",
    "bandit>=1.7.0",
]

[project.scripts]
ah = "ah.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ah"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit so results don't change with the ruff version:
# E4/E7/E9/F = errors and dead code, B904 = exception chaining,
# I = import order, UP = modern Python syntax.
select = ["E4", "E7", "E9", "F", "B904", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"


[tool.coverage.run]
source = ["ah"]
omit = ["tests/*", "ah/cli/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
