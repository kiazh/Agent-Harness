# F-13: the sdist used to force-include `skills` wholesale. Because
# force-include bypasses every exclude (see above), a checkout that had run
# Machina leaked skills/telemetry.json[.lock] into the source archive, and any
# untracked local skill was packaged too. Hatchling's default file selection is
# "every file not matched by .gitignore" — it does NOT know the git-tracked
# set — so an untracked, non-ignored skills/<local>/ would still ship. Select
# skills explicitly instead: exclude the whole tree, then re-include the
# built-in skill directories listed here (the committed set).
#
# MAINTENANCE: a new built-in skill must be added to BOTH this list and the
# wheel target's list. Local/learned skills intentionally stay out; runtime
# learning defaults to ~/.machina/skills, not the checkout.
[tool.hatch.build.targets.sdist]
exclude = [
    "skills/*",
    "!skills/alembic-migrations/",
    "!skills/background-jobs/",
    "!skills/chaos-engineering/",
    "!skills/cli-tui/",
