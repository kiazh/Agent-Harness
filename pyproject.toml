[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Machina"
version = "0.2.0"
description = "Self-hosted multi-agent AI orchestration framework with PostgreSQL-backed context"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kiarad Zafar Heidari" }]
keywords = ["ai", "agent", "llm", "postgresql", "langgraph", "rag"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "msgpack>=1.0.0",
    "cachetools>=5.3.0",
    "pyyaml>=6.0",
    "tiktoken>=0.5.0",
    "regex>=2024.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mcp==2.3.0",
    "cryptography>=44.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
secrets = ["boto3>=1.34.0"]
connectors = ["mcp==2.3.0"]
# Zero-API local embeddings (model2vec static models, pure NumPy). The
# zero-key default; base installs without it stay keyword-only (or OpenAI).
embeddings-local = ["model2vec>=0.10.0"]
# In-process ONNX embeddings (fastembed; no torch) — e.g. BAAI/bge-small-en-v1.5.
embeddings-onnx = ["fastembed>=0.9,<1.0"]
# Zero-API local cross-encoder reranking (fastembed ONNX; shares the dependency
# with embeddings-onnx). Local-first "auto" selects it whenever installed.
rerank = ["fastembed>=0.9,<1.0"]
workflow-trial = ["langgraph>=1.2.12", "langgraph-checkpoint-postgres>=3.1.2", "psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0.0",
    "ruff==0.16.9",
    "bandit>=1.7.0",
]

[project.scripts]
machina = "machina.cli:app"

[tool.hatch.build]
exclude = ["**/node_modules/**", "**/__pycache__/**", ".venv*", ".env", ".env.local", ".coverage", "coverage.xml"]

[tool.hatch.build.targets.wheel]
packages = ["machina"]

# AH-030: ship built-in skills inside the wheel so non-editable installs
# still discover SKILL.md content. Falls back to MACHINA_SKILLS_DIR
# at runtime when overridden.
# N5 (final pass): hatchling's force-include bypasses [tool.hatch.build]
# exclude (verified empirically), so gitignored runtime telemetry
# (skills/telemetry.json[.lock]) can ship in wheels built from a used
# checkout — counters only, no secrets. Image hygiene is enforced where it
# works: .dockerignore prunes these paths from Docker build contexts.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"

[tool.hatch.build.targets.sdist.force-include]
"skills" = "skills"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["skills/ecc", "machina/bundled_agents/ecc"]

[tool.ruff.lint]
# Explicit so results don't change with the ruff version:
# E4/E7/E9/F = errors and dead code, B904 = exception chaining,
# I = import order, UP = modern Python syntax.
select = ["E4", "E7", "E9", "F", "B904", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "ui_integration: full UI checks against the gateway (owned by the UI CI job)",
    "workflow_trial: optional native-versus-LangGraph research checks",
    "db: requires the dedicated PostgreSQL test database",
    "integration: exercises service or transport integration boundaries",
    "load: load/concurrent integration tests (deselect with '-m \"not load\"')",
]


[tool.coverage.run]
source = ["machina"]
omit = ["tests/*", "machina/cli/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
