[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# Export with --group build in CI, including the backend's transitive pins.
build = ["hatchling==1.32.4", "editables==0.5"]

[project]
name = "Machina"
version = "0.2.0"
description = "Self-hosted multi-agent AI orchestration framework with PostgreSQL-backed context"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kiarad Zafar Heidari" }]
keywords = ["ai", "agent", "llm", "postgresql", "langgraph", "rag"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "msgpack>=1.0.0",
    "cachetools>=5.3.0",
    "pyyaml>=6.0",
    "tiktoken>=0.5.0",
    "regex>=2024.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mcp==2.3.0",
    "cryptography>=44.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
secrets = ["boto3>=1.34.0"]
connectors = ["mcp==2.3.0"]
# Zero-API local embeddings (model2vec static models, pure NumPy). The
# zero-key default; base installs without it stay keyword-only (or OpenAI).
embeddings-local = ["model2vec>=0.10.0"]
# In-process ONNX embeddings (fastembed; no torch) — e.g. BAAI/bge-small-en-v1.5.
embeddings-onnx = ["fastembed>=0.9,<1.0"]
# Zero-API local cross-encoder reranking (fastembed ONNX; shares the dependency
# with embeddings-onnx). Local-first "auto" selects it whenever installed.
rerank = ["fastembed>=0.9,<1.0"]
workflow-trial = ["langgraph>=1.2.12", "langgraph-checkpoint-postgres>=3.1.2", "psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0.0",
    "ruff==0.16.9",
    "bandit>=1.7.0",
]

[project.scripts]
machina = "machina.cli:app"

[tool.hatch.build]
exclude = [
    "**/node_modules/**",
    "**/__pycache__/**",
    ".venv*",
    ".env",
    ".env.local",
    ".coverage",
    "coverage.xml",
    # Machine-local runtime state (gitignored). Never ship it in any artifact.
    "skills/telemetry.json",
    "skills/telemetry.json.lock",
]

# AH-030: ship built-in skills inside the wheel so non-editable installs
# still discover SKILL.md content. Falls back to MACHINA_SKILLS_DIR
# at runtime when overridden.
# N5 (final pass, fixed R4-095): hatchling's force-include bypasses every
# `exclude` (verified empirically), so gitignored runtime telemetry
# (skills/telemetry.json[.lock]) shipped in wheels built from a used checkout.
# The wheel target therefore selects `skills` through `packages` (normal file
# selection honors `exclude`) instead of force-include; member paths are
# unchanged.
[tool.hatch.build.targets.wheel]
packages = ["machina", "skills"]
# Same built-in skills allowlist as the sdist (F-13): untracked local skills
# and machine-local telemetry must not ship in any artifact.
exclude = [
    "skills/telemetry.json",
    "skills/telemetry.json.lock",
    "skills/*",
    "!skills/alembic-migrations/",
    "!skills/background-jobs/",
    "!skills/chaos-engineering/",
    "!skills/cli-tui/",
