# INFRA-n5 (infra audit), updated by R4-095: scheduled dependency-surface
# review. The workflows pin actions by commit SHA and the `Dockerfile` /
# `Dockerfile.sandbox` files pin base images by tag@digest; Dependabot's
# github-actions + docker ecosystems open the PRs that bump those references and
# refresh the trailing `# vX.Y.Z` comment — keep both halves. The docker
# ecosystem scans only Dockerfile-named files, so it does not cover base-image
# refs in workflows, docker-compose.yml or shell variables; those are bumped by
# hand. Each PR still flows through the full CI, which also gates
# `uv lock --check` before merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # uv.lock is the authoritative resolution. CI runs `uv lock --check`, so a
    # dependency bump must ship a regenerated uv.lock (`uv lock` on the branch);
    # Dependabot-only pyproject changes that skip the lock will fail CI by design.
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
