# INFRA-n5 (infra audit), updated by R4-095: scheduled dependency-surface
# review. The workflows pin every action by commit SHA and every base image by
# tag@digest; Dependabot opens the PRs that bump those SHAs/digests (for
# github-actions and docker it rewrites the pinned reference and refreshes the
# trailing `# vX.Y.Z` comment — keep both halves). Each PR still flows through
# the full CI, which now also gates `uv lock --check` before merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # uv.lock is the authoritative resolution. CI runs `uv lock --check`, so a
    # dependency bump must ship a regenerated uv.lock (`uv lock` on the branch);
    # Dependabot-only pyproject changes that skip the lock will fail CI by design.
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
