name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check ah/

      - name: Run ruff format check
        run: ruff format --check ah/

      - name: Run pytest
        run: pytest tests/ -v

      - name: Run mypy (if configured)
        run: |
          if grep -q '\[tool.mypy\]' pyproject.toml; then
            mypy ah/
          else
            echo "No mypy configuration found in pyproject.toml — skipping mypy."
          fi
