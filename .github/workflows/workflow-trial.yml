name: Workflow research

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches: [main]
    paths:
      - "machina/research/workflow_trial.py"
      - "tests/workflow_trial/**"
      - "tests/test_workflow_checkpoint_count.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/workflow-trial.yml"
  pull_request:
    branches: [main]
    paths:
      - "machina/research/workflow_trial.py"
      - "tests/workflow_trial/**"
      - "tests/test_workflow_checkpoint_count.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/workflow-trial.yml"

permissions:
  contents: read

concurrency:
  group: workflow-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-trial:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: machina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MACHINA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/machina_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: python -m pip install -e ".[dev,workflow-trial,connectors]"

      - name: Run native and LangGraph approval recovery trials
        run: python -m pytest tests/ -m workflow_trial -v --strict-markers
