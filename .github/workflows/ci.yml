name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentharness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentharness_test
      # tests/conftest.py points the database singleton at this (never at DATABASE_URL)
      AGENT_HARNESS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentharness_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,workflow-trial]"
          pip install pytest-cov bandit

      - name: Run ruff check
        run: ruff check ah/

      - name: Run ruff format check
        run: ruff format --check ah/

      - name: Run bandit security scan
        run: bandit -r ah/ -ll -x ah/cli/

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=ah \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ui:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentharness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENT_HARNESS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentharness_test
      AGENT_HARNESS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentharness_test
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python for real gateway tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gateway and initialize test schema
        working-directory: .
        run: |
          python -m pip install -e ".[dev]"
          python - <<'PY'
          import asyncio
          from ah.db.connection import db
          async def initialize():
              try:
                  await db.connect()
                  await db.initialize_schema()
              finally:
                  await db.close()
          asyncio.run(initialize())
          PY
          python -c "import sys; print('AH_TEST_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"

      - name: Install UI dependencies (lockfile, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
