name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain pinning (R4-095): every action is pinned to a commit SHA and
# every base image to tag@digest; the trailing comment keeps the human-facing
# version visible. Dependabot (github-actions ecosystem, .github/dependabot.yml)
# opens PRs that bump these action SHAs; it does not touch the `services:` image
# digests below (its docker ecosystem scans only Dockerfile-named files), so
# bump those by hand — they are deliberate. Do not rewrite any pin back to a
# moving tag. The SHA/tag mapping was resolved from the GitHub API on
# 2026-10-14 and is recorded in
# docs/verification/proofs/codebase_review_round4_2026-10-14/R4-095_infra.md.
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,connectors]"
          python -m pip install hatchling

      - name: Verify lockfile matches pyproject (uv lock --check)
        # R4-095: gates Dependabot/pyproject <-> uv.lock drift. Any pyproject
        # change (or Dependabot PR) that was not regenerated into uv.lock fails
        # here; run `uv lock` on the branch to fix. uv is pinned to the version
        # this lockfile (revision 3) is verified with; bump both together.
        run: |
          python -m pip install "uv==0.11.7"
          uv lock --check

      - name: Run ruff check
        run: python -m ruff check machina/ tools/

      - name: Run ruff format check
        run: python -m ruff format --check machina/ tools/

      - name: Run bandit security scan
        run: bandit -r machina/ -ll -x machina/cli/

      - name: Build distributable artifacts
        run: python -m hatchling build

      - name: Check wheel contents and isolated imports
        run: python tools/check_release_artifacts.py dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/*

  ui:
    # Owns the full UI check, including tests against a restarted real gateway.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: machina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MACHINA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/machina_test
      MACHINA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/machina_test
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Set up Python for real gateway tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install gateway and initialize test schema
        working-directory: .
        run: |
          python -m pip install -e ".[dev]"
          python - <<'PY'
          import asyncio
          from machina.db.connection import db
          async def initialize():
              try:
                  await db.connect()
                  await db.initialize_schema()
              finally:
                  await db.close()
          asyncio.run(initialize())
          PY
          python -c "import sys; print('MACHINA_TEST_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"

      - name: Install UI dependencies (lockfile, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Audit UI dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck, tests and lint
        run: npm run check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build backend image
        # Base images are pinned by digest in the Dockerfiles (R4-095);
        # Dependabot's docker ecosystem bumps them.
        run: docker build --tag machina:ci .
      - name: Build sandbox image
        # INFRA-B1: the sandbox image breaks silently if unbuilt (the terminal
        # sandbox feature then fails closed at runtime). Build it on every CI
        # run so a stale context (e.g. another rename) can never recur.
        run: docker build --tag machina-tool-sandbox:ci -f Dockerfile.sandbox .
      - name: Smoke-test installed CLI
        run: docker run --rm machina:ci --help
      - name: Validate Compose without loading local credentials
        run: MACHINA_API_KEY=ci-placeholder docker compose --env-file /dev/null config --quiet
