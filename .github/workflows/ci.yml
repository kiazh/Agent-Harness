name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: machina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/machina_test
      # tests/conftest.py points the database singleton at this (never at DATABASE_URL)
      MACHINA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/machina_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,connectors]"
          python -m pip install hatchling

      - name: Run ruff check
        run: python -m ruff check machina/ tools/

      - name: Run ruff format check
        run: python -m ruff format --check machina/ tools/

      - name: Run bandit security scan
        run: bandit -r machina/ -ll -x machina/cli/

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            -m "not ui_integration and not workflow_trial" \
            --cov=machina \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Build distributable artifacts
        run: python -m hatchling build

      - name: Check wheel contents and isolated imports
        run: python tools/check_release_artifacts.py dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ui:
    # Owns the full UI check, including tests against a restarted real gateway.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: machina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MACHINA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/machina_test
      MACHINA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/machina_test
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python for real gateway tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gateway and initialize test schema
        working-directory: .
        run: |
          python -m pip install -e ".[dev]"
          python - <<'PY'
          import asyncio
          from machina.db.connection import db
          async def initialize():
              try:
                  await db.connect()
                  await db.initialize_schema()
              finally:
                  await db.close()
          asyncio.run(initialize())
          PY
          python -c "import sys; print('MACHINA_TEST_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"

      - name: Install UI dependencies (lockfile, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Audit UI dependencies
        run: npm audit --audit-level=moderate

      - name: Typecheck, tests and lint
        run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag machina:ci .
      - name: Smoke-test installed CLI
        run: docker run --rm machina:ci --help
      - name: Validate Compose without loading local credentials
        run: MACHINA_API_KEY=ci-placeholder docker compose --env-file /dev/null config --quiet
