services:
  db:
    # Pinned by tag@digest (R4-095). Dependabot's docker ecosystem scans only
    # Dockerfile-named files, so it does not bump this compose digest — bump it
    # by hand (deliberately) when upgrading. Do not replace with a moving tag.
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: machina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # F-11: probe TCP on the application database. `pg_isready -U postgres`
      # checks the Unix socket/default DB and can pass while the first-boot
      # temporary server (listen_addresses='') is still running, before
      # `machina` exists on port 5432.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d machina"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # F-11: a transient connection refusal during first-boot must not leave
    # the API permanently down.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/machina
      # AH-AUDIT-039b / F-10: this block is the explicit, documented allowlist
      # of host `.env` variables that reach the container. Keep it in parity
      # with `.env.example` and the OPERATIONS.md configuration table; a
      # variable added there but not here is silently ignored in Compose.
      # `MACHINA_TEST_DATABASE_URL` is intentionally absent (tests only), and
      # mounted `*_FILE` secret paths are operator-specific: mount the secret
      # and set the `*_FILE` value through this block when deploying that way.
      # Empty defaults mean "unset" (the application default applies); secrets
      # are never baked into image layers (.env stays excluded via .dockerignore).
      MACHINA_PROVIDER: ${MACHINA_PROVIDER:-openrouter}
      MACHINA_MODEL: ${MACHINA_MODEL:-openrouter/free}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      MACHINA_API_KEY: ${MACHINA_API_KEY:?Set MACHINA_API_KEY in .env}
      MACHINA_PROVENANCE_KEY: ${MACHINA_PROVENANCE_KEY:-}
      MACHINA_OAUTH_MASTER_KEY: ${MACHINA_OAUTH_MASTER_KEY:-}
      # Retrieval (dense embeddings, reranking, RRF fusion).
      MACHINA_EMBEDDING_BACKEND: ${MACHINA_EMBEDDING_BACKEND:-}
      MACHINA_EMBEDDING_MODEL: ${MACHINA_EMBEDDING_MODEL:-}
      MACHINA_EMBEDDING_BASE_URL: ${MACHINA_EMBEDDING_BASE_URL:-}
      MACHINA_RERANKER_BACKEND: ${MACHINA_RERANKER_BACKEND:-}
      MACHINA_RERANKER_LOCAL_MODEL: ${MACHINA_RERANKER_LOCAL_MODEL:-}
      MACHINA_RERANKER_HTTP_URL: ${MACHINA_RERANKER_HTTP_URL:-}
      MACHINA_RERANKER_HTTP_MODEL: ${MACHINA_RERANKER_HTTP_MODEL:-}
      MACHINA_RRF_KEYWORD_WEIGHT: ${MACHINA_RRF_KEYWORD_WEIGHT:-}
      MACHINA_RRF_DENSE_WEIGHT: ${MACHINA_RRF_DENSE_WEIGHT:-}
      SEARXNG_URL: ${SEARXNG_URL:-}
      # Persona memory and runtime learning.
      MACHINA_PERSONA_MEMORY_ENABLED: ${MACHINA_PERSONA_MEMORY_ENABLED:-}
      MACHINA_PERSONA_DEFAULT_EMOTION: ${MACHINA_PERSONA_DEFAULT_EMOTION:-}
      MACHINA_LEARNING_REVIEW_AUTO_APPLY: ${MACHINA_LEARNING_REVIEW_AUTO_APPLY:-}
      MACHINA_LEARNING_REVIEW_AUTO_APPLY_PER_DAY: ${MACHINA_LEARNING_REVIEW_AUTO_APPLY_PER_DAY:-}
      MACHINA_LEARNED_SKILLS_DIR: ${MACHINA_LEARNED_SKILLS_DIR:-}
      # Operations: workspace, timeouts, rate limits, lifetime budgets.
      MACHINA_WORKSPACE_ROOT: ${MACHINA_WORKSPACE_ROOT:-}
      MACHINA_TURN_TIMEOUT: ${MACHINA_TURN_TIMEOUT:-}
      MACHINA_APPROVAL_TIMEOUT: ${MACHINA_APPROVAL_TIMEOUT:-}
      MACHINA_HTTP_RATE_LIMIT: ${MACHINA_HTTP_RATE_LIMIT:-}
      MACHINA_USAGE_SESSION_TOKEN_LIMIT: ${MACHINA_USAGE_SESSION_TOKEN_LIMIT:-0}
      MACHINA_USAGE_SESSION_REQUEST_LIMIT: ${MACHINA_USAGE_SESSION_REQUEST_LIMIT:-0}
      MACHINA_USAGE_AGENT_TOKEN_LIMIT: ${MACHINA_USAGE_AGENT_TOKEN_LIMIT:-0}
      MACHINA_USAGE_AGENT_REQUEST_LIMIT: ${MACHINA_USAGE_AGENT_REQUEST_LIMIT:-0}
      MACHINA_HOME: /home/appuser/.machina
      MACHINA_SCRIPTS_DIR: /app/scripts
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # F-12: the host checkout is mounted for read-only inspection at a path
      # that is NOT on sys.path (cwd stays /app, and /app/machina comes from
      # the image). The old `./machina:/app/machina:ro` made `python -m
      # machina…` from /app import the host tree while console scripts used
      # site-packages — a split-brain that could run two different revisions.
      # Edits to the host tree never reach the running container; rebuild the
      # image to change runtime code.
      - ./machina:/opt/host-machina:ro
      - ./scripts:/app/scripts:ro
      # AH-AUDIT-039a: explicit writable application home/state path with
      # correct non-root ownership (seeded from the image dir, see
      # Dockerfile) while code/root stay read-only. Persistent config and
      # learned state survive restart/recreate; the DB volume is untouched.
      # F-35: renamed from `ahhome`; see the legacy alias below.
      - machina-home:/home/appuser/.machina:rw
    entrypoint: ["/bin/sh", "-c"]
    command: ["machina init && exec machina serve --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  # F-35: canonical application home (was `ahhome`). To carry state over from a
  # pre-rename deployment, see the one-time copy command in OPERATIONS.md.
  machina-home:
  # One-release legacy alias: the pre-rename name, declared so it is never
  # silently re-created/renamed by Compose and operators can migrate it. It is
  # NOT mounted; `app` uses `machina-home`. Remove this entry in the release
  # after the next one.
  ahhome:
