services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentharness
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/agentharness
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_HARNESS_API_KEY: ${AGENT_HARNESS_API_KEY:?Set AGENT_HARNESS_API_KEY in .env}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./ah:/app/ah:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["ah init && exec ah serve --host 0.0.0.0 --port 8000"]

volumes:
  pgdata:
