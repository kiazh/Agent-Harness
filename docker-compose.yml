services:
  db:
    # Pinned by tag@digest (R4-095). Dependabot's docker ecosystem scans only
    # Dockerfile-named files, so it does not bump this compose digest — bump it
    # by hand (deliberately) when upgrading. Do not replace with a moving tag.
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: machina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/machina
      # AH-AUDIT-039b: provider selection + per-provider keys forwarded
      # explicitly from host configuration (empty default = unset; secrets
      # never baked into image layers — .env stays excluded via .dockerignore).
      MACHINA_PROVIDER: ${MACHINA_PROVIDER:-openrouter}
      MACHINA_MODEL: ${MACHINA_MODEL:-openrouter/free}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
      CUSTOM_BASE_URL: ${CUSTOM_BASE_URL:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      MACHINA_API_KEY: ${MACHINA_API_KEY:?Set MACHINA_API_KEY in .env}
      MACHINA_PROVENANCE_KEY: ${MACHINA_PROVENANCE_KEY:-}
      MACHINA_HOME: /home/appuser/.machina
      MACHINA_SCRIPTS_DIR: /app/scripts
      MACHINA_USAGE_SESSION_TOKEN_LIMIT: ${MACHINA_USAGE_SESSION_TOKEN_LIMIT:-0}
      MACHINA_USAGE_SESSION_REQUEST_LIMIT: ${MACHINA_USAGE_SESSION_REQUEST_LIMIT:-0}
      MACHINA_USAGE_AGENT_TOKEN_LIMIT: ${MACHINA_USAGE_AGENT_TOKEN_LIMIT:-0}
      MACHINA_USAGE_AGENT_REQUEST_LIMIT: ${MACHINA_USAGE_AGENT_REQUEST_LIMIT:-0}
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # R4-095: this mount is INERT for the compose service. `machina
      # init`/`serve` run through the console entry point, which imports the
      # pip-installed copy in site-packages (/app is not on sys.path for a
      # console script) — edits to the host tree do NOT reach the running
      # container, so rebuild the image to change runtime code. It is kept for
      # read-only source inspection only. Caveat: ad-hoc `python -m machina…`
      # or `python -c` run from /app DOES pick this tree up (cwd is on
      # sys.path there); that mixed-code path is the stale-code trap this note
      # warns about — don't rely on it for deployments.
      - ./machina:/app/machina:ro
      - ./scripts:/app/scripts:ro
      # AH-AUDIT-039a: explicit writable application home/state path with
      # correct non-root ownership (seeded from the image dir, see
      # Dockerfile) while code/root stay read-only. Persistent config and
      # learned state survive restart/recreate; the DB volume is untouched.
      - ahhome:/home/appuser/.machina:rw
    entrypoint: ["/bin/sh", "-c"]
    command: ["machina init && exec machina serve --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  ahhome:
